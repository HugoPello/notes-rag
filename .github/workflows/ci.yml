name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Python version as the Dockerfile (python:3.14-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Gemini is faked and Chroma uses temp folders: no network calls, no secrets needed.
      - name: Run tests
        run: pytest
